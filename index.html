<style>

  .checked span{font-size:12px;color:var(--mute)}

  /* unavailable path — per-element de-emphasis, NEVER a group opacity */
  .why{margin:12px 16px 0;padding:12px 14px;border-radius:14px;border:1px dashed rgba(255,255,255,.22);
       font-size:13px;line-height:1.5;color:var(--soft)}

    <h1 class="h1">THREE WAYS IN</h1>
    <p class="sub">Everyone lands Jun 9, books their own. These differ in <strong>cost</strong>, <strong>hours</strong>, and <strong>what happens if a flight slips</strong>.</p>
  </header>

  <div class="prow" id="deps"></div>
  <div class="srow">
    <button class="sbtn" id="sbEis">ABOUT EIS</button>
    <button class="sbtn" id="sbStt">ABOUT STT</button>

</div>

<script>
/* ---------------------------------------------------------------------------
   RECOVERY = chip + one line. The chip is the WORST case across the visible
   flights; when severity varies it names the spread and the line names both
   ends. The line is DERIVED whenever it mentions a time, so it can never drift
   from the list rendered beneath it.

   SAMPLE DATA — replace the two blocks below wholesale.
   Keyed departure -> path -> direction. Availability AND recovery both vary by
   home airport (MSY has two EIS arrivals, BHM has one); keying by path alone
   silently flattens Path A to a single verdict everywhere.
--------------------------------------------------------------------------- */
var AQUA = "#3ee6c4", AMBER = "#ffb03a", PINK = "#ff4d8d";
var SEV = { room:{c:AQUA,ink:"#04332a"}, tight:{c:AMBER,ink:"#43290a"}, none:{c:PINK,ink:"#3d0620"} };

var DEPS = [];      /* [[code,city],…]  built from flights.json.homes */
var DEPHUB = {};    /* { MSY:{eis:true}, … }  built from what routes actually exist */
var SCHED = {};     /* SCHED[dep][path][dir] = [[time,flightNo,via,layover,farePP,status,note],…] */
var CHECKED = "";   /* "Checked 2 Aug 2026" — from flights.json.updated */
var NOTICE = "";    /* crossings.json.notice */

/* The chip states the DEADLINE, not a severity grade.
   A tired reader is asking "if my flight is late, am I fine?" — a deadline answers that in one
   read with no legend, and it differs per path, so the three chips can never collapse into the
   same string the way VARIES · WORST NONE did.
   Chips DERIVE from the visible list per direction — none are constants. `binding` names what
   runs out if you're late; null means the transfer never does. */
var PATHS = {
  eis:   { name:"Fly into EIS",            tag:"Land on Tortola. No boat at all.",
           transfer:"25 min taxi to the marina", sev:"none",  binding:"flight" },
  ferry: { name:"STT, then the ferry",     tag:"45-min ferry over — on the ferry's clock.",
           transfer:"45 min ferry, then 10 min taxi", sev:"tight", binding:"ferry" },
  taxi:  { name:"STT, then a private boat", tag:"30-min boat over — on your clock.",
           transfer:"30 min boat, then 10 min taxi", sev:"room",  binding:null }
};

/* Ferry sailings differ by direction: outbound the last boat over is the deadline; coming home
   the boat is one of four morning options and YOUR FLIGHT is what binds. */
var FERRIES = { out:"5:30p", ret:null };

/* authored copy is used ONLY where the line names no flight time */
var FLAT = {
  eis:   { out:"One flight in. Miss it and you land Jun 10.", ret:"One flight out. No later option." },
  ferry: { out:"Every listed arrival makes the last ferry.",  ret:"Four sailings over. Pick one and go." },
  taxi:  { out:"Boats run on demand. One operator has quoted.", ret:"Boat leaves when you're ready." }
};

var ROWS = {};      /* built from crossings.json — one source of truth with the estimator */

/* three facts, decision-changing one last */
var SHEETS = {
  eis:{ t:"EIS · Tortola", s:"no boat needed", c:AQUA, facts:[
    "One route in — American, through Miami.",
    "25-minute taxi to the marina.",
    "Not every home airport connects to it."] },
  stt:{ t:"STT · St. Thomas", s:"two ways over", c:AMBER, facts:[
    "Three US airlines, flights all day.",
    "Ferry to Road Town — 45 min, last one 5:30p.",
    "Or a private boat, on your schedule."] }
};

var state = { dep:"MSY", open:"ferry", dir:"out", sheet:null };

function fade(hex,a){ var n=parseInt(hex.slice(1),16);
  return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")"; }
function el(t,c,x){ var n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n; }
/* "$4,952.77" -> 4952.77 · "$60–70" -> 60 (low end) · TBD/— -> null */
function money(s){ if(s==="TBD"||s==="—") return null;
  var n=parseFloat(String(s).split("–")[0].replace(/[^0-9.]/g,"")); return isNaN(n)?null:n; }

/* ===================== DATA BUILD =========================================
   Everything below derives SCHED / ROWS / DEPS from flights.json + crossings.json.
   Nothing about a flight is authored here: add a trip to flights.json (or a new
   home airport, with its offset in flights.json.tz) and this page picks it up.
========================================================================== */

/* "1:42p" -> 822 minutes past midnight. 12:44p -> 764. 12:30a -> 30. */
function mins(s){
  var t = String(s).trim().toLowerCase(), ap = t.slice(-1);
  var hm = t.slice(0,-1).split(":"), h = parseInt(hm[0],10) % 12;
  if(ap === "p") h += 12;
  return h*60 + parseInt(hm[1],10);
}
function clock(t){
  var h = Math.floor(t/60), m = t%60, ap = h < 12 ? "a" : "p";
  h = h % 12; if(h === 0) h = 12;
  return h + ":" + (m<10?"0":"") + m + ap;
}
function dur(t){
  var h = Math.floor(t/60), m = t%60;
  return h + "h" + (m<10?"0":"") + m;
}
function usd(n){
  return n == null ? "TBD" : "$" + Number(n).toLocaleString("en-US",
    {minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits:2});
}

/* A leg pair -> [time, flightNo, via, layover, fare, status, note].
   Layover is measured at the connecting airport, so both clocks are already in
   the same zone — no offset math needed. Arrival/departure times are local to
   their own airport, which is exactly what a traveller reads off a boarding pass. */
function legRow(legsArr, dirKey, price){
  var a = legsArr[0], b = legsArr[1];
  var t  = dirKey === "out" ? b.arr : a.dep;
  var fl = dirKey === "out" ? b.flight : a.flight;
  /* [6] note is written later by annotate(); [7] is the other end of the day —
     what time you leave home outbound, what time you get home on the return.
     Neither is anywhere else on the row and both change which flight people pick. */
  var other = dirKey === "out" ? a.dep : b.arr;
  return [t, fl, a.to, dur(mins(b.dep) - mins(a.arr)), price, "ok", "", other, null];
}

/* Same flight can appear at several fares (different return pairings). Keep the
   cheapest per time+flight, then order by the clock. */
function dedupe(rows){
  var seen = {};
  rows.forEach(function(r){
    var k = r[0] + "|" + r[1];
    if(!seen[k] || r[4] < seen[k][4]) seen[k] = r;
  });
  var out = Object.keys(seen).map(function(k){ return seen[k]; });
  out.sort(function(x,y){ return mins(x[0]) - mins(y[0]); });
  return out;
}

function buildData(F, C){
  var fs = C.ferrySchedule;
  var lastSail = mins(fs.outbound.departures[fs.outbound.departures.length-1]);
  var buffer   = fs.bufferMins;                       /* land -> on the boat */
  var retSails = fs["return"].departures.map(mins);
  var retReady = fs["return"].crossingMins + fs.checkinMins;  /* leave Road Town -> at the gate */

  DEPS = F.homes.slice();
  CHECKED = "Checked " + new Date(F.updated + "T12:00:00Z").toLocaleDateString("en-US",
    { day:"numeric", month:"short", year:"numeric", timeZone:"UTC" });
  NOTICE = C.notice || "";

  SCHED = {}; DEPHUB = {};
  DEPS.forEach(function(h){
    SCHED[h[0]] = { eis:{out:[],ret:[]}, ferry:{out:[],ret:[]}, taxi:{out:[],ret:[]} };
  });

  F.trips.forEach(function(t){
    var S = SCHED[t.home]; if(!S) return;
    var o = legRow(t.out, "out", t.price), r = legRow(t.back, "ret", t.price);

    if(t.island === "EIS"){ S.eis.out.push(o); S.eis.ret.push(r); return; }

    /* Path C — the boat is on demand, so every STT itinerary qualifies. */
    S.taxi.out.push(o.slice()); S.taxi.ret.push(r.slice());

    /* Path B — outbound you have to be on the last sailing; the flight that
       can't make it still gets listed, flagged, because "why isn't my $620
       fare here" is a worse question than seeing why it doesn't work. */
    var ob = o.slice();
    if(mins(ob[0]) + buffer > lastSail) ob[5] = "fail";
    S.ferry.out.push(ob);

    /* Return: a sailing only counts if it lands early enough to make the flight. */
    var rb = r.slice(), dep = mins(rb[0]);
    var good = retSails.filter(function(s){ return s + retReady <= dep; });
    if(good.length) { rb[8] = Math.max.apply(null, good); S.ferry.ret.push(rb); }
  });

  DEPS.forEach(function(h){
    var S = SCHED[h[0]];
    ["eis","ferry","taxi"].forEach(function(k){
      S[k].out = dedupe(S[k].out);
      S[k].ret = dedupe(S[k].ret);
    });
    DEPHUB[h[0]] = { eis: S.eis.out.length > 0 };
    annotate(S, lastSail);
  });

  buildRows(C);
}

/* Marks the final usable option in each list and writes the per-flight note.
   The note says what this flight means FOR THIS PATH — the same 3:43p arrival is
   "1h47 before the last ferry" on B and "boat waits for you" on C. */
function annotate(S, lastSail){
  ["eis","ferry","taxi"].forEach(function(k){
    ["out","ret"].forEach(function(d){
      var list = S[k][d];
      var usable = list.filter(function(r){ return r[5] !== "fail"; });
      var final = usable[usable.length-1];
      if(final) final[5] = "last";

      /* The note never repeats the chip or the tagline — those already say which
         flight is last and what the path is. It carries the two facts the row
         itself can't show: the other end of the travel day, and (path B only)
         how much slack you have against the boat. */
      list.forEach(function(r){
        if(d === "out"){
          r[6] = "leaves " + r[7];
          if(k === "ferry") r[6] += r[5] === "fail" ? " · arrives after the last ferry"
                                                    : " · " + dur(lastSail - mins(r[0])) + " before the last ferry";
        } else {
          r[6] = (k === "ferry" && r[8] != null ? clock(r[8]) + " ferry over · " : "") + "home " + r[7];
        }
      });
    });
  });
}

/* Cost rows come out of crossings.json so this page and the estimator can never
   disagree. Every crossing amount is null until Matt's calls land, which is why
   the drawer totals read TBD rather than a partial sum. */
function buildRows(C){
  var d = C.defaults || {};
  var airportDay = (d.airportParking||0) + (d.airportFood||0);
  var spend = (d.dailySpendMid||0) * (d.nights||5);

  function tail(){
    return [
      ["Boat, deposit + balance","per couple, fixed", usd(C.boat.perCouple)],
      ["Crew tip","20%, cash on board", usd(C.boat.tip)],
      ["Airport day costs","parking, food, drinks", usd(airportDay)],
      ["On-island spending", usd(d.dailySpendMid) + "/day × " + (d.nights||5), usd(spend)],
      ["Jun 9 lodging","open decision","TBD"]
    ];
  }
  function head(){ return [["Airfare, both of you","round trip, cheapest listed", null]]; }
  function fromCross(node){
    return (node.rows||[]).map(function(r){ return [r.label, r.sub, usd(r.amount)]; });
  }

  ROWS = {
    eis:   head().concat(fromCross(C.eis),        tail()),
    ferry: head().concat(fromCross(C.ferry),      tail()),
    taxi:  head().concat(fromCross(C.watertaxi),  tail())
  };
}

function legs(key,dir){
  var d = SCHED[state.dep];
  return (d && d[key] && d[key][dir]) || [];
}

function render(){
  /* home airport */
  var dw = document.getElementById("deps"); dw.innerHTML="";
  DEPS.forEach(function(d){
    var b = el("button","chip"+(d[0]===state.dep?" on":""));
    b.appendChild(el("div","code",d[0]));
    b.appendChild(el("div","city",d[1]));
    b.onclick = function(){ state.dep=d[0]; render(); };
    dw.appendChild(b);
  });

  /* explainers — one at a time */
  document.getElementById("sbEis").classList.toggle("on", state.sheet==="eis");
  document.getElementById("sbStt").classList.toggle("on", state.sheet==="stt");
  var sw = document.getElementById("sheet"); sw.innerHTML="";
  if(state.sheet){
    var sh = SHEETS[state.sheet];
    var box = el("div","sheet");
    box.style.background = fade(sh.c,.07);
    box.style.border = "1px solid " + fade(sh.c,.3);
    var hd = el("div","sheet-hd");
    var t = el("div","t",sh.t); t.style.color = sh.c;
    hd.appendChild(t); hd.appendChild(el("div","s",sh.s)); box.appendChild(hd);
    sh.facts.forEach(function(f){
      var row = el("div","fact"); var dot = el("i"); dot.style.background = sh.c;
      row.appendChild(dot); row.appendChild(el("span",null,f)); box.appendChild(row);
    });
    sw.appendChild(box);
  }

  var city = (DEPS.filter(function(d){return d[0]===state.dep;})[0]||DEPS[0])[1];
  var wrap = document.getElementById("paths"); wrap.innerHTML="";

  ["eis","ferry","taxi"].forEach(function(key){
    var p = PATHS[key], hub = DEPHUB[state.dep];
    var card = el("section","path");

    /* ---- unavailable: keeps its slot and order, no expand affordance ---- */
    if(key==="eis" && !hub.eis){
      var hd0 = el("div","phd static");
      var top0 = el("div","ptop"), l0 = el("div");
      l0.style.flex="1";
      var nm0 = el("div","pname", p.name); nm0.style.color = "#7ba6bd";
      l0.appendChild(nm0);
      var r0 = el("div");
      r0.appendChild(el("div","pprice na","—"));
      r0.appendChild(el("div","psub","no routing"));
      top0.appendChild(l0); top0.appendChild(r0); hd0.appendChild(top0);
      hd0.appendChild(el("div","verdict out","NOT FROM " + state.dep));
      hd0.appendChild(el("div","pline","Nothing from " + city + " connects in time."));
      card.appendChild(hd0);
      card.appendChild(el("p","why","EIS has one route in from the US — American, through Miami. Nothing out of " + city + " connects to it on Jun 9."));
      var nx = el("div","next");
      var ar = el("i",null,"↓"); nx.appendChild(ar);
      nx.appendChild(el("p",null,"Your options from " + city + " are the ferry and the water taxi."));
      card.appendChild(nx);
      wrap.appendChild(card);
      return;
    }

    var list = legs(key, state.dir);
    var fail = list.filter(function(f){ return f[5]==="fail"; })[0];
    /* A chip whose job is to state a deadline must never render without one — fall back to the
       final entry rather than trusting a marker to be present in the data. */
    var last = list.filter(function(f){ return f[5]==="last"; })[0] || list[list.length-1];
    var sev = SEV[p.sev];
    var open = state.open === key;
    if(open){ card.classList.add("open"); card.style.background = "rgba(255,255,255,.075)"; }

    /* round trip, both people. Fares are already round trip, so this is cheapest × 2 — summing
       the two directions would double-count. Uses the outbound list so it holds still when the
       direction toggles. */
    var couple = legs(key,"out").filter(function(f){ return f[5] !== "fail"; })
                 .reduce(function(m,f){ return Math.min(m,f[4]); }, Infinity) * 2;

    /* Name whatever is actually scarce for THIS itinerary, not the path's label.
       A missed deadline runs out of the transfer; a final flight runs out of flights.
       Private boats never run out, so that path never names a boat as scarce. */
    var line;
    if(fail && p.binding)      line = "The " + fail[0] + " arrival misses the last " + p.binding + ".";
    else if(last && list.length > 1 && last !== list[0]) line = list[0][0] + " has a later flight. " + last[0] + " doesn't.";
    else                       line = FLAT[key][state.dir];

    var btn = el("button","phd");
    var top = el("div","ptop"), lft = el("div");
    lft.style.flex="1"; lft.style.minWidth="0";
    lft.appendChild(el("div","pname", p.name));
    var rgt = el("div");
    var pr = el("div","pprice","$" + couple.toLocaleString());
    rgt.appendChild(pr); rgt.appendChild(el("div","psub","airfare only"));
    top.appendChild(lft); top.appendChild(rgt); btn.appendChild(top);

    /* the tagline is the differentiator — it says what this path IS, before any drawer opens */
    var tag = el("div","ptag", p.tag);
    tag.style.color = "#fff";
    btn.appendChild(tag);

    /* Chip derives from the visible list AND the direction — no path hardcodes its deadline.
       Outbound the transfer can be the binding constraint; on the return your flight always is. */
    var chip, chipSev = p.sev;
    if(key === "eis"){
      chip = list.length === 1 ? "ONE FLIGHT ONLY" : "LAST FLIGHT " + last[0].toUpperCase();
      if(list.length === 1) chipSev = "tight";   // a single route is a fact, not a failure
    } else if(key === "ferry"){
      chip = FERRIES[state.dir]
        ? "LAST FERRY " + FERRIES[state.dir].toUpperCase()
        : "LAST FLIGHT " + last[0].toUpperCase();
      if(!FERRIES[state.dir]) chipSev = "none";
    } else {
      /* boats never run out — but the flights into STT do, and no boat rescues a missed flight */
      chip = "NO BOAT CUTOFF";
    }
    var sev = SEV[chipSev];
    if(open){ card.style.borderColor = fade(sev.c,.34); }

    var v = el("div","verdict", chip);
    v.style.background = sev.c; v.style.color = sev.ink; v.style.border = "1px solid " + sev.c;
    btn.appendChild(v);
    btn.appendChild(el("div","pline", line));

    var meta = el("div","pmeta");
    meta.appendChild(el("div","m", p.transfer));
    var more = el("div","more");
    more.appendChild(el("span",null, open ? "Less" : "Flights"));
    more.appendChild(el("span","caret","▾"));
    meta.appendChild(more); btn.appendChild(meta);
    btn.setAttribute("aria-expanded", String(open));
    btn.onclick = function(){ state.open = open ? null : key; render(); };
    card.appendChild(btn);

    /* ---- drawer: the itinerary browser, folded in ---- */
    var dr = el("div","drawer"); dr.hidden = !open;
    var dirs = el("div","dirs");
    [["out","OUTBOUND · JUN 9","dirOut"],["ret","RETURN · JUN 16","dirRet"]].forEach(function(d){
      var b = el("button","dir"+(state.dir===d[0]?" on":""), d[1]);
      b.id = d[2];
      b.onclick = function(){ state.dir = d[0]; render(); };
      dirs.appendChild(b);
    });
    dr.appendChild(dirs);
    dr.appendChild(el("div","farecap","fares below are per person, round trip"));

    list.forEach(function(f){
      var row = el("div","fl"), t = el("div","fl-top");
      t.appendChild(el("div","fl-t", f[0]));
      t.appendChild(el("div","fl-l", f[1] + " · " + f[2] + " " + f[3]));
      t.appendChild(el("div","fl-f", "$" + f[4].toLocaleString()));
      row.appendChild(t);
      row.appendChild(el("div","fl-n" + (f[5]==="fail" ? " warn" : ""), f[6]));
      dr.appendChild(row);
    });

    dr.appendChild(el("div","dhd","WHAT IT COSTS"));
    var amounts = ROWS[key].map(function(r,i){ return i===0 ? "$"+couple : r[2]; });
    var pending = amounts.filter(function(a){ return money(a)===null; }).length;
    var sum = amounts.reduce(function(t,a){ return t + (money(a)||0); },0);
    var anyRange = amounts.some(function(a){ return String(a).indexOf("–")>-1; });

    ROWS[key].forEach(function(r,i){
      var amt = amounts[i], tbd = amt==="TBD", na = amt==="—";
      if(i===0) amt = "$" + couple.toLocaleString();
      var row = el("div","r"), left = el("div");
      left.appendChild(el("div","rl"+(na?" na":""), r[0]));
      left.appendChild(el("div","rs", r[1]));
      row.appendChild(left);
      row.appendChild(el("div","amt"+(tbd?" tbd":na?" na":""), amt));
      dr.appendChild(row);
    });

    /* a subtotal containing any TBD row renders TBD — never a partial sum */
    var tot = el("div","rtotal"), tl = el("div");
    tl.appendChild(el("div","t","Trip total, per couple"));
    tl.appendChild(el("div","s", pending
      ? pending + " figure" + (pending>1?"s":"") + " still unconfirmed"
      : "low end of the quoted ranges"));
    tot.appendChild(tl);
    tot.appendChild(el("div","v"+(pending?" tbd":""), pending ? "TBD"
      : (anyRange?"from $":"$") + Math.round(sum).toLocaleString()));
    dr.appendChild(tot);

    var ck = el("div","checked"); ck.appendChild(el("i"));
    ck.appendChild(el("span",null,CHECKED));
    dr.appendChild(ck);

    card.appendChild(dr);
    wrap.appendChild(card);
  });
}

document.getElementById("sbEis").onclick = function(){ state.sheet = state.sheet==="eis"?null:"eis"; render(); };
document.getElementById("sbStt").onclick = function(){ state.sheet = state.sheet==="stt"?null:"stt"; render(); };

/* CHAT badge — n>0 numbered (caps 9+), -1 dot only, 0 hidden */
window.setChatBadge = function(n){
  var b = document.getElementById("chatBadge");
  if(n===0){ b.hidden = true; return; }
  b.hidden = false;
  if(n===-1){ b.classList.add("dot"); b.textContent=""; }
  else { b.classList.remove("dot"); b.textContent = n>9 ? "9+" : String(n); }
};

/* ---- boot: real data, then render. The in-chat preview and file:// can't run
   fetch(), so this will only ever succeed on the live Pages URL. ---- */
function boot(){
  var bust = "?v=" + Date.now();
  Promise.all([
    fetch("flights.json" + bust).then(function(r){ if(!r.ok) throw 0; return r.json(); }),
    fetch("crossings.json" + bust).then(function(r){ if(!r.ok) throw 0; return r.json(); })
  ]).then(function(res){
    buildData(res[0], res[1]);
    if(DEPS.length && !SCHED[state.dep]) state.dep = DEPS[0][0];
    document.getElementById("loadmsg").textContent =
      "Fares are real. Crossings and lodging aren't quoted yet.";
    render();
  }).catch(function(){
    document.getElementById("loadmsg").textContent =
      "Couldn't load the flight data. If you're offline, try again on a signal.";
  });
}
boot();
</script>
</body>
</html>
